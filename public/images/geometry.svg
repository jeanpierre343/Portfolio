<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background subtle radial gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear gradients for sharp geometric strokes -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyberPurple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters for nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep ambient glow canvas backing -->
  <rect width="800" height="800" fill="url(#bgGlow)" />

  <!-- Layer 1: Isometric Grid / Mathematical Matrix Perspective -->
  <g stroke="url(#cyberCyan)" stroke-width="0.5" opacity="0.25">
    <!-- Diagonal Parallel Lines Set A -->
    <line x1="-100" y1="200" x2="700" y2="1000" />
    <line x1="0" y1="100" x2="800" y2="900" />
    <line x1="100" y1="0" x2="900" y2="800" />
    <line x1="200" y1="-100" x2="1000" y2="700" />
    <line x1="300" y1="-200" x2="1100" y2="600" />
    
    <!-- Diagonal Parallel Lines Set B -->
    <line x1="900" y1="200" x2="100" y2="1000" />
    <line x1="800" y1="100" x2="0" y2="900" />
    <line x1="700" y1="0" x2="-100" y2="800" />
    <line x1="600" y1="-100" x2="-200" y2="700" />
    <line x1="500" y1="-200" x2="-300" y2="600" />
  </g>

  <!-- Layer 2: Concentric Technical Circles -->
  <g fill="none" stroke-linecap="round">
    <circle cx="450" cy="400" r="280" stroke="url(#cyberPurple)" stroke-width="1" stroke-dasharray="4, 12" opacity="0.4" />
    <circle cx="450" cy="400" r="200" stroke="url(#cyberCyan)" stroke-width="1.5" stroke-dasharray="180, 50, 20, 40" opacity="0.6" />
    <circle cx="450" cy="400" r="120" stroke="#3b82f6" stroke-width="1" stroke-dasharray="10, 30" opacity="0.5" />
    <circle cx="450" cy="400" r="50" stroke="#d946ef" stroke-width="2" stroke-dasharray="5, 5" opacity="0.7" />
  </g>

  <!-- Layer 3: Polyhedral Geometric Formations -->
  <!-- Outer Cube Frame -->
  <polygon points="450,150 680,280 680,540 450,670 220,540 220,280" fill="none" stroke="url(#cyberCyan)" stroke-width="2" opacity="0.8" />
  
  <!-- Inner Connecting Facets -->
  <g fill="none" stroke="url(#cyberPurple)" stroke-width="1" opacity="0.6">
    <!-- Center to vertices -->
    <line x1="450" y1="400" x2="450" y2="150" stroke-width="1.5" />
    <line x1="450" y1="400" x2="680" y2="280" />
    <line x1="450" y1="400" x2="680" y2="540" />
    <line x1="450" y1="400" x2="450" y2="670" stroke-width="1.5" />
    <line x1="450" y1="400" x2="220" y2="540" />
    <line x1="450" y1="400" x2="220" y2="280" />
    
    <!-- Secondary internal diamond structure -->
    <polygon points="450,260 580,340 580,470 450,550 320,470 320,340" stroke="url(#cyberCyan)" stroke-width="1.5" />
  </g>

  <!-- Layer 4: Tech Accents (Crosshairs, Nodes, Data Points) -->
  <!-- Crosshairs -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.5">
    <line x1="450" y1="80" x2="450" y2="120" />
    <line x1="450" y1="680" x2="450" y2="720" />
    <line x1="130" y1="400" x2="170" y2="400" />
    <line x1="730" y1="400" x2="770" y2="400" />
  </g>

  <!-- Glowing Interface Nodes -->
  <g id="nodes">
    <!-- Central Node -->
    <circle cx="450" cy="400" r="6" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="450" cy="400" r="3" fill="#ffffff" />

    <!-- Outer Structural Nodes -->
    <circle cx="450" cy="150" r="5" fill="#d946ef" filter="url(#glow)" />
    <circle cx="680" cy="280" r="4" fill="#06b6d4" />
    <circle cx="680" cy="540" r="4" fill="#3b82f6" />
    <circle cx="450" cy="670" r="5" fill="#d946ef" filter="url(#glow)" />
    <circle cx="220" cy="540" r="4" fill="#06b6d4" />
    <circle cx="220" cy="280" r="4" fill="#3b82f6" />

    <!-- Floating Data Nodes -->
    <circle cx="320" cy="340" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="580" cy="470" r="3" fill="#ffffff" opacity="0.8" />
  </g>
</svg>